  - id: DEC-2026-1021-002-pedagogical-invariants-lock
    kind: pedagogy
    tier: P0
    status: ACTIVE
    date: "2026-10-21"
    authority_ref: "docs/02-learning-architecture và ARCHITECTURE.md"
    subject: "Bốn bất biến sư phạm bất khả xâm phạm"
    decision: >
      1. Skipped != Failed (Bỏ qua không giảm điểm, không cảnh báo đỏ).
      2. Support != Independent (Có dùng hint thì gán has_support: true, không tính vào bằng chứng độc lập).
      3. Technical Failure != Learner Failure (Lỗi mic/mạng phải có luồng cứu hộ, hiển thị thông báo dịu nhẹ).
      4. Growth Garden != Streak Punishment (Vắng mặt không phạt reset cây tiến độ về 0).
    impacted_paths:
      - "00-intake/sot/pedagogical-invariants.md"
      - "04-coding/apps/web/src/features/lesson/"
      - "04-coding/apps/api/src/modules/learning/"

  - id: DEC-2026-1021-003-token-progressive-disclosure
    kind: token-optimization
    tier: P1
    status: ACTIVE
    date: "2026-10-21"
    authority_ref: "Kinh nghiệm từ TDC PRJ_FOLDER zflow & orchestration-protocol"
    subject: "Quy chuẩn Progressive Disclosure <= 100 dòng cho Skills và <= 80 dòng cho Plans"
    decision: >
      Mọi file SKILL.md bắt buộc <= 100 dòng; mọi file plan.md bắt buộc <= 80 dòng.
      Chi tiết mở rộng phải đặt trong references/ hoặc phase-XX-*.md và nạp on-demand.
      Subagent dispatch dùng prompt packet <= 250 tokens, cấm truyền session history dài.
